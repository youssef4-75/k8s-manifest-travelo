apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelo-frontend
  template:
    metadata:
      labels:
        app: travelo-frontend
    spec: 
      containers:
      - name: frontend
        image: youssef475/travelo-frontend:latest
        ports:
        - containerPort: 80
                # Liveness Probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60    # Wait 60s before first check
          periodSeconds: 10           # Check every 10s
          timeoutSeconds: 5           # Timeout after 5s
          successThreshold: 1         # 1 success = healthy
          failureThreshold: 3         # 3 failures = restart container
        
        # Readiness Probe - checks if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30    # Wait 30s before first check
          periodSeconds: 5           # Check every 5s
          timeoutSeconds: 3          # Timeout after 3s
          successThreshold: 1        # 1 success = ready
          failureThreshold: 3        # 3 failures = mark as not ready
        
        # Startup Probe - for slow-starting applications (optional)
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30       # 30 failures * 10s = 5 min max startup time
        
