# namespace.yml
apiVersion: v1
kind: Namespace
metadata:
  name: travelo

---
# mysql-secret.yml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: travelo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: travelo_db
  MYSQL_USER: travelo
  MYSQL_PASSWORD: travelo123

---
# backend-configmap.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: travelo
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/travelo_db?createDatabaseIfNotExist=true"
  SPRING_DATASOURCE_USERNAME: "travelo"

---
# mysql-statefulset.yml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-service
  namespace: travelo
spec:
  serviceName: mysql-service
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0.44-debian
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi

---
# mysql-service.yml
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: travelo
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306

---
# backend-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelo-backend
  template:
    metadata:
      labels:
        app: travelo-backend
    spec:
      containers:
      - name: backend
        image: localhost:5000/travelo_backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD

---
# backend-service.yml
apiVersion: v1
kind: Service
metadata:
  name: travelo-backend
  namespace: travelo
spec:
  type: ClusterIP
  selector:
    app: travelo-backend
  ports:
  - port: 8080
    targetPort: 8080

---
# frontend-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelo-frontend
  template:
    metadata:
      labels:
        app: travelo-frontend
    spec:
      containers:
      - name: frontend
        image: localhost:5000/travelo_frontend:latest
        ports:
        - containerPort: 80

---
# frontend-service.yml
apiVersion: v1
kind: Service
metadata:
  name: travelo-frontend
  namespace: travelo
spec:
  type: NodePort
  selector:
    app: travelo-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000