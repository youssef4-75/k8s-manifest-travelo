apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-developer
  namespace: travelo
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
