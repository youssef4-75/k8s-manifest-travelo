apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelo-ingress
  namespace: travelo
spec:
  ingressClassName: nginx
  rules:
  - host: travelo.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: travelo-backend-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: travelo-frontend-service
            port:
              number: 80